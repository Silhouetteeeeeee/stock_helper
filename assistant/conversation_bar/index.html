<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Source Sans Pro", "Microsoft YaHei", system-ui, sans-serif;
    color: #e6e9ef;
    overflow: hidden;
  }
  .bar { display: flex; flex-direction: column; gap: 8px; padding: 2px 0 4px; }
  .search {
    width: 100%;
    box-sizing: border-box;
    height: 30px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid #394154;
    background: #1b202b;
    color: #e6e9ef;
    font-size: 12px;
    outline: none;
  }
  .search:focus { border-color: #4c8dff; }
  /* 侧栏里的竖排胶囊列表：搜索在组件内本地过滤，不打回 Streamlit */
  .chips {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 42vh;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    box-sizing: border-box;
    width: 100%;
    padding: 6px 10px;
    border-radius: 9px;
    background: #262c3a;
    border: 1px solid #394154;
    font-size: 12.5px;
    line-height: 1.25;
    cursor: grab;
    user-select: none;
    touch-action: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: border-color 0.08s, background 0.08s;
  }
  .chip:hover { border-color: #4c8dff; }
  .chip.pressing { border-color: #4c8dff; background: #2d3650; }
  .chip.dragging { opacity: 0.35; }
  .chip .name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip .badge {
    flex: 0 0 auto;
    padding: 0 4px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    line-height: 15px;
    background: #394154;
    color: #dce7ff;
  }
  .chip.left { border-color: #4c8dff; }
  .chip.left .badge { background: #4c8dff; color: #fff; }
  .chip.right { border-color: #e8a33d; }
  .chip.right .badge { background: #e8a33d; color: #1b202b; }
  .empty { font-size: 12px; opacity: 0.6; padding: 2px 2px 4px; }
  .hint { font-size: 11px; opacity: 0.5; }
  /* 备用投放框：拿不到页面 DOM 时才在组件里显示 */
  .slots { display: none; gap: 10px; }
  .slots.visible { display: flex; }
  .slot {
    flex: 1;
    min-width: 0;
    height: 56px;
    border: 1.5px dashed #3d465c;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 11.5px;
    color: #aab3c5;
    padding: 0 8px;
    transition: border-color 0.12s, background 0.12s, color 0.12s;
  }
  .slot span, .slot b {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .slot.over { border-color: #4c8dff; background: rgba(76, 141, 255, 0.12); color: #dce7ff; }
  .slot b { color: #f2f5fa; font-weight: 600; }
  .ghost {
    position: fixed;
    z-index: 10;
    padding: 5px 11px;
    border-radius: 15px;
    background: #4c8dff;
    color: #fff;
    font-size: 12.5px;
    pointer-events: none;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>
  <div class="bar">
    <input class="search" id="search" placeholder="搜索对话" autocomplete="off" />
    <div class="chips" id="chips"></div>
    <div class="slots" id="slots">
      <div class="slot" id="slot-left"></div>
      <div class="slot" id="slot-right"></div>
    </div>
    <div class="hint">点击打开 · 长按拖到页面右半屏</div>
  </div>

<script>
const Streamlit = {
  send(type, payload) {
    window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, "*");
  },
  ready() {
    this.send("streamlit:componentReady", { apiVersion: 1 });
  },
  setHeight(height) {
    this.send("streamlit:setFrameHeight", { height });
  },
  setValue(value) {
    this.send("streamlit:setComponentValue", { value });
  },
};

const state = {
  conversations: [],
  panes: { left: null, right: null },
  labels: { left: "", right: "" },
};

const searchEl = document.getElementById("search");
const chipsBox = document.getElementById("chips");
const slotsBox = document.getElementById("slots");
const slotEls = {
  left: document.getElementById("slot-left"),
  right: document.getElementById("slot-right"),
};

// Streamlit 的组件 iframe 带 allow-same-origin，可以直接拿到页面文档，
// 拖动时把投放区画在整页上（侧栏里的投放框够不到右半屏）。
let parentWin = null;
let parentDoc = null;
try {
  if (window.parent && window.parent.document) {
    parentWin = window.parent;
    parentDoc = parentWin.document;
  }
} catch (error) {
  parentWin = null;
  parentDoc = null;
}

let query = "";
let press = null;   // { id, chip, timer, startX, startY, pointerId, moved }
let drag = null;    // { id, chip, page, ghost? }
let pageDrag = null; // { root, zones, ghost }
let hoverSide = null;

function conversationById(id) {
  return state.conversations.find((item) => Number(item.id) === Number(id)) || null;
}

function chipText(item) {
  return item.title || item.name || `对话 ${item.id}`;
}

function renderChips() {
  chipsBox.querySelectorAll(".chip, .empty").forEach((node) => node.remove());
  const needle = query.toLowerCase();
  const items = state.conversations.filter((item) => {
    if (!needle) return true;
    return [item.title, item.name, item.code]
      .filter(Boolean)
      .some((text) => String(text).toLowerCase().includes(needle));
  });
  if (!items.length) {
    const empty = document.createElement("span");
    empty.className = "empty";
    empty.textContent = state.conversations.length ? "没有匹配的对话" : "还没有保存的对话";
    chipsBox.appendChild(empty);
    return;
  }
  items.forEach((item) => {
    const chip = document.createElement("div");
    chip.className = "chip";
    const id = Number(item.id);
    if (state.panes.left === id) {
      chip.classList.add("left");
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "左";
      chip.appendChild(badge);
    } else if (state.panes.right === id) {
      chip.classList.add("right");
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "右";
      chip.appendChild(badge);
    }
    const label = document.createElement("span");
    label.className = "name";
    label.textContent = chipText(item);
    chip.appendChild(label);
    chip.dataset.id = String(id);
    chip.addEventListener("pointerdown", onChipDown);
    chipsBox.appendChild(chip);
  });
}

function renderSlots() {
  const left = state.labels.left || "当前会话";
  const right = state.labels.right || "拖到这里分屏";
  slotEls.left.innerHTML = "";
  const leftLabel = document.createElement("span");
  leftLabel.textContent = "左栏";
  const leftValue = document.createElement("b");
  leftValue.textContent = left;
  slotEls.left.append(leftLabel, leftValue);

  slotEls.right.innerHTML = "";
  const rightLabel = document.createElement("span");
  rightLabel.textContent = "右栏";
  const rightValue = document.createElement("b");
  rightValue.textContent = right;
  slotEls.right.append(rightLabel, rightValue);
}

function render() {
  renderChips();
  renderSlots();
  requestAnimationFrame(() => Streamlit.setHeight(document.body.scrollHeight));
}

function onChipDown(event) {
  if (event.button !== 0) return;
  event.preventDefault();
  const chip = event.currentTarget;
  press = {
    id: Number(chip.dataset.id),
    chip,
    startX: event.clientX,
    startY: event.clientY,
    pointerId: event.pointerId,
    moved: false,
    timer: setTimeout(beginDrag, 250),
  };
  chip.classList.add("pressing");
}

// ---------------------------------------------------------------------------
// 整页拖动：拖动时在页面文档上盖一层，左右各一个投放区
// ---------------------------------------------------------------------------
function toPage(x, y) {
  try {
    const rect = window.frameElement.getBoundingClientRect();
    return { x: rect.left + x, y: rect.top + y };
  } catch (error) {
    return { x, y };
  }
}

function mainRect() {
  const el = parentDoc.querySelector('[data-testid="stMain"]')
    || parentDoc.querySelector("section.main");
  if (el) {
    const rect = el.getBoundingClientRect();
    return { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
  }
  return { left: 0, top: 0, width: parentWin.innerWidth, height: parentWin.innerHeight };
}

function moveGhost(node, x, y) {
  node.style.left = `${x}px`;
  node.style.top = `${y}px`;
}

function beginPageDrag(id, x, y) {
  if (!parentDoc || !parentWin) return false;
  const rect = mainRect();
  const pad = 24;
  const gap = 18;
  const top = rect.top + 24;
  const height = Math.max(rect.height - 24 - 48, 180);
  const zoneWidth = Math.max((rect.width - pad * 2 - gap) / 2, 120);

  const root = parentDoc.createElement("div");
  root.setAttribute("data-cbar-overlay", "1");
  root.style.cssText = [
    "position:fixed", "inset:0", "z-index:2147483000",
    "background:rgba(8,12,18,0.38)", "cursor:grabbing",
  ].join(";");

  const zones = {};
  [["left", "左栏"], ["right", "右栏"]].forEach(([side, heading], index) => {
    const box = parentDoc.createElement("div");
    box.style.cssText = [
      "position:fixed",
      `top:${top}px`,
      `left:${rect.left + pad + index * (zoneWidth + gap)}px`,
      `width:${zoneWidth}px`,
      `height:${height}px`,
      "box-sizing:border-box",
      "border:2px dashed #5a6a88",
      "border-radius:14px",
      "display:flex",
      "flex-direction:column",
      "align-items:center",
      "justify-content:center",
      "gap:8px",
      "color:#c9d6ea",
      "font:600 14px/1.3 'Microsoft YaHei',system-ui,sans-serif",
      "background:rgba(18,24,36,0.55)",
      "pointer-events:none",
      "transition:border-color .12s,background .12s",
    ].join(";");
    const head = parentDoc.createElement("div");
    head.textContent = heading;
    head.style.cssText = "font-size:13px;font-weight:500;opacity:.7;";
    const name = parentDoc.createElement("div");
    name.textContent = state.labels[side] || (side === "left" ? "当前会话" : "拖到这里分屏");
    name.style.cssText = [
      "max-width:82%", "overflow:hidden", "text-overflow:ellipsis",
      "white-space:nowrap", "color:#eef3fb",
    ].join(";");
    box.append(head, name);
    root.appendChild(box);
    zones[side] = box;
  });

  const ghost = parentDoc.createElement("div");
  const item = conversationById(id);
  ghost.textContent = item ? chipText(item) : "对话";
  ghost.style.cssText = [
    "position:fixed", "z-index:2147483001", "pointer-events:none",
    "transform:translate(-50%,-50%)", "padding:6px 12px", "border-radius:15px",
    "background:#4c8dff", "color:#fff",
    "font:600 12.5px/1.2 'Microsoft YaHei',system-ui,sans-serif",
    "box-shadow:0 6px 18px rgba(0,0,0,.45)",
    "max-width:260px", "overflow:hidden", "text-overflow:ellipsis", "white-space:nowrap",
  ].join(";");
  const start = toPage(x, y);
  moveGhost(ghost, start.x, start.y);
  root.appendChild(ghost);

  parentDoc.body.appendChild(root);
  pageDrag = { root, zones, ghost };
  root.addEventListener("pointermove", onPageMove);
  root.addEventListener("pointerup", onPageUp);
  root.addEventListener("pointercancel", onPageCancel);
  parentDoc.addEventListener("keydown", onPageKey);
  return true;
}

function teardownPageDrag() {
  if (pageDrag) {
    pageDrag.root.remove();
    pageDrag = null;
  }
  if (parentDoc) {
    parentDoc.removeEventListener("keydown", onPageKey);
    // 页面被别的操作重绘时可能留下孤儿层，顺手清掉
    parentDoc.querySelectorAll("[data-cbar-overlay]").forEach((node) => node.remove());
  }
}

function sideAtPoint(x, y) {
  if (!pageDrag) return null;
  for (const [side, box] of Object.entries(pageDrag.zones)) {
    const rect = box.getBoundingClientRect();
    if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
      return side;
    }
  }
  return null;
}

function highlightPage(side) {
  if (!pageDrag) return;
  hoverSide = side;
  Object.entries(pageDrag.zones).forEach(([key, box]) => {
    const on = key === side;
    box.style.borderColor = on ? "#4c8dff" : "#5a6a88";
    box.style.background = on ? "rgba(76,141,255,0.16)" : "rgba(18,24,36,0.55)";
    box.style.color = on ? "#dce7ff" : "#c9d6ea";
  });
}

function onPageMove(event) {
  if (!pageDrag) return;
  event.preventDefault();
  moveGhost(pageDrag.ghost, event.clientX, event.clientY);
  highlightPage(sideAtPoint(event.clientX, event.clientY));
}

function onPageUp(event) {
  const side = sideAtPoint(event.clientX, event.clientY);
  finishDrag(side);
}

function onPageCancel() {
  finishDrag(null);
}

function onPageKey(event) {
  if (event.key === "Escape") finishDrag(null);
}

function finishDrag(side) {
  const grabbed = drag;
  drag = null;
  if (grabbed && grabbed.chip) grabbed.chip.classList.remove("dragging");
  teardownPageDrag();
  resetPress();
  if (grabbed && side) drop(side, grabbed.id);
}

// ---------------------------------------------------------------------------
// 拖动 / 点击
// ---------------------------------------------------------------------------
function beginDrag() {
  if (!press) return;
  const { id, chip, startX, startY, pointerId } = press;
  clearTimeout(press.timer);
  chip.classList.add("dragging");
  // 触屏有隐式指针捕获，先释放，后面的移动事件才会落到页面覆盖层上
  try {
    if (chip.hasPointerCapture && chip.hasPointerCapture(pointerId)) {
      chip.releasePointerCapture(pointerId);
    }
  } catch (error) { /* 旧浏览器没有指针捕获，忽略 */ }

  if (beginPageDrag(id, startX, startY)) {
    drag = { id, chip, page: true };
    return;
  }

  // 备用：拿不到页面文档时退回组件内的左右投放框
  const ghost = document.createElement("div");
  ghost.className = "ghost";
  const item = conversationById(id);
  ghost.textContent = item ? chipText(item) : "对话";
  ghost.style.left = `${startX}px`;
  ghost.style.top = `${startY}px`;
  document.body.appendChild(ghost);
  drag = { id, chip, page: false, ghost };
  slotsBox.classList.add("visible");
  renderSlots();
  requestAnimationFrame(() => Streamlit.setHeight(document.body.scrollHeight));
}

function sideAt(x, y) {
  for (const [side, node] of Object.entries(slotEls)) {
    const rect = node.getBoundingClientRect();
    if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
      return side;
    }
  }
  return null;
}

function highlight(side) {
  hoverSide = side;
  Object.entries(slotEls).forEach(([key, node]) => {
    node.classList.toggle("over", key === side);
  });
}

function openConversation(id) {
  Streamlit.setValue({ action: "open", id: Number(id), nonce: Date.now() });
}

function drop(side, id) {
  const panes = { ...state.panes };
  const other = side === "left" ? "right" : "left";
  if (panes[side] === id) return; // 已经在这一栏
  if (panes[other] === id) {
    // 同一会话不能同时占两栏：右栏为空时，拖左栏当前会话过去不算数
    if (side === "right" && panes[side] === null) return;
    panes[other] = panes[side];
  }
  panes[side] = id;
  state.panes = panes;
  render();
  // nonce 让 Streamlit 每次拖放都当成新值，触发页面刷新
  Streamlit.setValue({ action: "assign", panes, nonce: Date.now() });
}

function resetPress() {
  if (press) {
    clearTimeout(press.timer);
    press.chip.classList.remove("pressing");
    press = null;
  }
  slotsBox.classList.remove("visible");
  requestAnimationFrame(() => Streamlit.setHeight(document.body.scrollHeight));
}

function endPress(event, commit) {
  const pressed = press;
  const grabbed = drag;
  if (grabbed && grabbed.page) return; // 整页拖动由页面上的监听收尾
  const side = grabbed ? (commit ? sideAt(event.clientX, event.clientY) : hoverSide) : null;

  if (grabbed && grabbed.ghost) grabbed.ghost.remove();
  if (grabbed && grabbed.chip) grabbed.chip.classList.remove("dragging");
  if (pressed) {
    clearTimeout(pressed.timer);
    pressed.chip.classList.remove("pressing");
  }
  highlight(null);
  slotsBox.classList.remove("visible");
  press = null;
  drag = null;
  requestAnimationFrame(() => Streamlit.setHeight(document.body.scrollHeight));

  if (!commit) return;
  if (grabbed) {
    if (side) drop(side, grabbed.id);
  } else if (pressed && !pressed.moved) {
    openConversation(pressed.id);
  }
}

window.addEventListener("pointermove", (event) => {
  if (drag && drag.page) return;
  if (drag) {
    drag.ghost.style.left = `${event.clientX}px`;
    drag.ghost.style.top = `${event.clientY}px`;
    highlight(sideAt(event.clientX, event.clientY));
    return;
  }
  if (press) {
    const moved = Math.hypot(
      event.clientX - press.startX,
      event.clientY - press.startY
    );
    if (moved > 8) {
      press.moved = true;
      clearTimeout(press.timer);
      press.chip.classList.remove("pressing");
      press = null;
    }
  }
});

window.addEventListener("pointerup", (event) => {
  // 正常情况下页面覆盖层会截住松手事件；万一落回组件里也把拖动收尾
  if (drag && drag.page) {
    const point = toPage(event.clientX, event.clientY);
    finishDrag(sideAtPoint(point.x, point.y));
    return;
  }
  endPress(event, true);
});
window.addEventListener("pointercancel", (event) => {
  if (drag && drag.page) {
    finishDrag(null);
    return;
  }
  endPress(event, false);
});

searchEl.addEventListener("input", () => {
  query = searchEl.value.trim();
  renderChips();
  requestAnimationFrame(() => Streamlit.setHeight(document.body.scrollHeight));
});

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  state.conversations = Array.isArray(args.conversations) ? args.conversations : [];
  state.panes = args.panes || { left: null, right: null };
  state.labels = args.labels || { left: "", right: "" };
  // 页面重绘时把没来得及收起的拖动层清掉
  if (!drag) teardownPageDrag();
  render();
});

window.addEventListener("resize", () => Streamlit.setHeight(document.body.scrollHeight));

try {
  if (parentDoc) parentDoc.querySelectorAll("[data-cbar-overlay]").forEach((node) => node.remove());
} catch (error) { /* 跨域时没有可清理的页面层 */ }

Streamlit.ready();
render();
</script>
</body>
</html>
