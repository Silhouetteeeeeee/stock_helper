[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-suite"
version = "0.1.0"
dependencies = ["openai>=1.0", "streamlit>=1.40", "starlette>=0.37", "uvicorn>=0.30"]

[tool.setuptools]
packages = ["stock", "market_widget", "common", "assistant", "research"]
# data 是数据目录不是Python包，不要写进去

[tool.setuptools.package-data]
market_widget = ["assets/*.svg"]
